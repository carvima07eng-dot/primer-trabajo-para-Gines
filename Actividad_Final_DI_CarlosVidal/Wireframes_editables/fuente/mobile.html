<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Wireframe Mobile 375x667 — Inicio</title>
<link rel="stylesheet" href="wf.css">
<style>
body{width:375px;height:667px;background:var(--fondo)}
.hd{height:56px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--linea)}
.esc{width:28px;height:32px;border:2px solid var(--texto);border-radius:3px 3px 14px 14px}
.hd b{font-size:16px}
.lang{margin-left:auto;font-weight:600;font-size:14px;min-width:48px;min-height:48px;display:flex;align-items:center;justify-content:center}
.pad{padding:12px 16px}
.s .input{height:48px;font-size:15px}
.alert{margin:0 16px;padding:10px 12px;border-radius:6px;font-size:14px;display:flex;gap:8px;align-items:center}
h2{font-size:20px;margin:14px 16px 8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px}
.tile{background:#fff;border:1px solid var(--linea);border-radius:10px;min-height:72px;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:6px;font-weight:600;font-size:15px;line-height:1.25}
.tile .ico{width:22px;height:22px}
.more{margin:10px 16px 0;text-align:center;color:var(--azul);font-weight:600;min-height:48px;display:flex;align-items:center;justify-content:center;border:2px solid var(--azul);border-radius:8px;background:#fff}
.tab{position:absolute;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid var(--linea);display:grid;grid-template-columns:repeat(5,1fr)}
.tab div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--texto2)}
.tab div .ico{width:22px;height:22px;border-color:var(--texto2)}
.tab .on{color:var(--azul)} .tab .on .ico{border-color:var(--azul);background:var(--azul)}
.tab .on::before{content:"";position:absolute;top:0;width:40px;height:3px;background:var(--azul)}
</style></head><body class="sm">
<div class="hd" data-co="1" data-nobox><div class="esc"></div><b>Ajuntament d'Alzira</b><div class="lang">VAL|ES</div></div>
<div class="pad s"><div class="input" data-co="2" data-cp="tr" data-pad="4">🔍 ¿Qué necesitas hacer?</div></div>
<div class="alert" data-co="3" data-cp="tr" data-pad="4"><span class="ico r" style="width:18px;height:18px;border-color:var(--ambar-tx)"></span>Aviso amarillo por lluvias · Ver más</div>
<h2>Trámites más usados</h2>
<div class="tiles" data-co="4" data-pad="5">
 <div class="tile"><span class="ico"></span>Pedir cita previa</div>
 <div class="tile"><span class="ico"></span>Pagar tributos</div>
 <div class="tile"><span class="ico"></span>Padrón y certificados</div>
 <div class="tile"><span class="ico"></span>Avisar de incidencia</div>
 <div class="tile"><span class="ico"></span>Farmacias de guardia</div>
 <div class="tile"><span class="ico"></span>Instancia general</div>
</div>
<div class="more" data-co="5" data-cp="tr" data-pad="4">Ver todos los trámites</div>
<h2 style="margin-top:16px">Noticias</h2>
<div style="margin:0 16px;display:flex;gap:10px"><div class="img" style="width:80px;height:56px;flex:none"></div><div><div class="line" style="width:200px"></div><div class="line" style="width:150px;margin-top:8px"></div></div></div>
<div class="tab" data-co="6" data-pad="0">
 <div class="on"><span class="ico"></span>Inicio</div>
 <div><span class="ico"></span>Trámites</div>
 <div><span class="ico"></span>Cita</div>
 <div><span class="ico r"></span>Avisos</div>
 <div><span class="ico"></span>Más</div>
</div>
<script src="annot.js"></script>
</body></html>
